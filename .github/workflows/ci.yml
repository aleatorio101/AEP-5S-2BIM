name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ─── Build e testes da aplicação ──────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rodar testes
        run: ./mvnw test -B

      - name: Build da aplicação
        run: ./mvnw package -DskipTests -B

  # ─── Build da imagem Docker + scan de vulnerabilidades ────────────────
  docker-build-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true

      - name: Trivy scan de vulnerabilidades
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0 # troque para 1 para bloquear o pipeline em caso de achado crítico

      - name: Push da imagem (somente main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  # ─── Terraform plan (validação de infra em PRs) ───────────────────────
  terraform-plan:
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      # Para rodar "terraform plan" de verdade, configure os secrets
      # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY e TF_VAR_db_password
      # e descomente o passo abaixo:
      #
      # - name: Terraform plan
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
      #   run: terraform plan -no-color

