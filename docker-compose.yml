version: "3.9"

# ─── EduAlerta – Docker Compose ──────────────────────────────────────────────
# Uso:
#   Só o banco (desenvolvimento local):  docker compose up db
#   Stack completa:                       docker compose up

services:

  db:
    image: postgres:16-alpine
    container_name: edualerta-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: edualerta
      POSTGRES_USER: edualerta
      POSTGRES_PASSWORD: edualerta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edualerta -d edualerta"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edualerta-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: edualerta
      DB_USER: edualerta
      DB_PASS: edualerta
      JWT_SECRET: ${JWT_SECRET:-Y2hhbmdlTWVJblByb2R1Y3Rpb25UaGlzSXNOb3RTZWNyZXRBdEFsbA==}
      JWT_EXPIRATION_MS: 86400000
      UPLOAD_DIR: /app/uploads
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
    name: edualerta-pgdata
  uploads:
    name: edualerta-uploads
