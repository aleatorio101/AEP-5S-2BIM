# ─── EduAlerta – Configuração Principal ───────────────────────────────────────
spring:
  application:
    name: edualerta

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edualerta}
    username: ${DB_USER:edualerta}
    password: ${DB_PASS:edualerta}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

security:
  jwt:

    secret: ${JWT_SECRET:Y2hhbmdlTWVJblByb2R1Y3Rpb25UaGlzSXNOb3RTZWNyZXRBdEFsbA==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h

app:
  upload-dir: ${UPLOAD_DIR:uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    com.edualerta: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
